[workspace]
resolver = "2"
members = [
    "crates/markus-core",
    "crates/markus-server",
    "crates/markus-tui",
    "crates/markus-cli",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
authors = ["Markus Contributors"]
license = "MIT"
repository = "https://github.com/Precise-Goals/Markus"

[workspace.dependencies]
# Inference
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["json"] }
axum-extra = { version = "0.10" }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TUI
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = { version = "0.29", features = ["event-stream"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI parsing
clap = { version = "4", features = ["derive", "color", "env"] }

# Filesystem / system utilities
dirs = "6"
walkdir = "2"
indicatif = { version = "0.17", features = ["rayon"] }
console = "0.15"
colored = "2"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
byteorder = "1"
memmap2 = "0.9"
num_cpus = "1"
sysinfo = "0.34"
toml = "0.8"
tokio-stream = "0.1"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
